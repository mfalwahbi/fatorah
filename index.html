<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فواتيري | لوحة التحكم</title>
  
  <!-- الأيقونة والربط بالتطبيق -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/9485/9485672.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/9485/9485672.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'sans-serif'] },
          colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }, darkbg: '#0f172a', darkcard: '#1e293b' }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHaMqxrZhz__lHRAovWeoH0bIZl8_icjo",
      authDomain: "my-invoices-1ede0.firebaseapp.com",
      projectId: "my-invoices-1ede0",
      storageBucket: "my-invoices-1ede0.firebasestorage.app",
      messagingSenderId: "317993613361",
      appId: "1:317993613361:web:aa2354ab0da2ffca5afd10"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const invoicesCol = collection(db, "invoices");

    let allInvoices = [];
    let selectedCategory = "الكل";
    let selectedStore = "الكل";
    let searchQuery = "";
    let html5QrScanner = null;

    onSnapshot(query(invoicesCol, orderBy("createdAt", "desc")), (snapshot) => {
      allInvoices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderUI();
      updateAnalytics();
    });

    function updateAnalytics() {
      const totalSpent = allInvoices.reduce((sum, inv) => sum + Number(inv.amount), 0);
      document.getElementById("statTotal").innerText = totalSpent.toLocaleString();
      document.getElementById("statCount").innerText = allInvoices.length;

      if (allInvoices.length > 0) {
        const counts = allInvoices.reduce((acc, inv) => { acc[inv.category] = (acc[inv.category] || 0) + Number(inv.amount); return acc; }, {});
        const topCategory = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
        document.getElementById("statTopCat").innerText = topCategory;
      } else {
        document.getElementById("statTopCat").innerText = "-";
      }
    }

    function renderUI() {
      let searchedList = allInvoices;
      if (searchQuery.trim() !== "") {
        const q = searchQuery.toLowerCase();
        searchedList = allInvoices.filter(inv => 
          (inv.store && inv.store.toLowerCase().includes(q)) || 
          (inv.items && inv.items.toLowerCase().includes(q)) || 
          (inv.category && inv.category.toLowerCase().includes(q))
        );
      }

      const dynamicCategories = ["الكل", ...new Set(searchedList.map(inv => inv.category).filter(Boolean))];
      document.getElementById("categoryChips").innerHTML = dynamicCategories.map(cat => `
        <button onclick="window.changeCategory('${cat}')" class="px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all duration-300 ${selectedCategory === cat ? 'bg-brand-600 text-white shadow-lg shadow-brand-500/30' : 'bg-white dark:bg-darkcard text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700'}">${cat}</button>
      `).join("");

      const filteredByCat = selectedCategory === "الكل" ? searchedList : searchedList.filter(inv => inv.category === selectedCategory);
      const dynamicStores = ["الكل", ...new Set(filteredByCat.map(inv => inv.store).filter(Boolean))];
      document.getElementById("storeChips").innerHTML = dynamicStores.map(st => `
        <button onclick="window.changeStore('${st}')" class="px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all duration-300 ${selectedStore === st ? 'bg-gray-800 dark:bg-gray-100 text-white dark:text-gray-900' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400'}">${st}</button>
      `).join("");

      const finalList = selectedStore === "الكل" ? filteredByCat : filteredByCat.filter(inv => inv.store === selectedStore);
      const listBox = document.getElementById("invoicesList");

      if (finalList.length === 0) {
        listBox.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400"><i data-lucide="package-open" class="mx-auto w-12 h-12 mb-3 opacity-50"></i><p>لا توجد فواتير مطابقة</p></div>`;
        lucide.createIcons();
        return;
      }

      listBox.innerHTML = finalList.map(inv => {
        let warrantyHtml = "";
        if (inv.warrantyDate) {
          const isExpired = new Date(inv.warrantyDate) < new Date();
          const colorClass = isExpired ? 'text-red-500 dark:text-red-400 bg-red-50 dark:bg-red-900/20' : 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20';
          const icon = isExpired ? 'shield-alert' : 'shield-check';
          warrantyHtml = `<div class="inline-flex items-center gap-1 mt-2 px-2 py-1 rounded-md text-[10px] font-bold ${colorClass}"><i data-lucide="${icon}" class="w-3 h-3"></i> ${isExpired ? 'الضمان منتهي' : 'الضمان ساري: ' + inv.warrantyDate}</div>`;
        }

        return `
        <div class="group bg-white dark:bg-darkcard p-5 rounded-2xl shadow-sm hover:shadow-md border border-gray-100 dark:border-gray-800 transition-all relative overflow-hidden flex flex-col h-full">
          <div class="absolute top-0 right-0 w-1.5 h-full bg-brand-500 rounded-r-2xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="flex justify-between items-start mb-3">
            <div>
              <h3 class="font-bold text-gray-900 dark:text-white text-lg">${inv.store}</h3>
              <span class="inline-block mt-1 text-[10px] bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 px-2 py-1 rounded-md font-bold">${inv.category}</span>
            </div>
            <button onclick="window.deleteInvoice('${inv.id}')" class="text-gray-300 hover:text-red-500 p-2 bg-gray-50 dark:bg-gray-800 rounded-full transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
          <p class="text-sm text-gray-500 dark:text-gray-400 mb-2 line-clamp-2 flex-grow">${inv.items || "بدون تفاصيل"}</p>
          ${warrantyHtml}
          <div class="flex justify-between items-end pt-3 mt-3 border-t border-gray-100 dark:border-gray-800">
            <div class="text-xs text-gray-400 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${inv.date}</div>
            <div class="font-black text-xl text-gray-900 dark:text-white">${Number(inv.amount).toLocaleString()} <span class="text-xs font-normal text-gray-500">ر.س</span></div>
          </div>
        </div>
      `}).join("");
      lucide.createIcons();
    }

    window.handleSearch = (e) => {
      searchQuery = e.target.value;
      renderUI();
    };

    window.changeCategory = (cat) => { selectedCategory = cat; selectedStore = "الكل"; renderUI(); };
    window.changeStore = (st) => { selectedStore = st; renderUI(); };
    window.deleteInvoice = async (id) => { if (confirm("حذف الفاتورة؟")) await deleteDoc(doc(db, "invoices", id)); };

    window.openScanner = () => {
      document.getElementById("scannerSection").classList.remove("hidden");
      html5QrScanner = new Html5Qrcode("reader");
      html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
        try {
          const bin = atob(decodedText);
          let i = 0, store = "", date = "", total = "";
          while (i < bin.length) {
            let tag = bin.charCodeAt(i++), len = bin.charCodeAt(i++);
            let val = bin.substring(i, i + len); i += len;
            if (tag === 1) store = decodeURIComponent(escape(val));
            if (tag === 3) date = val.split("T")[0];
            if (tag === 4) total = val;
          }
          document.getElementById("inpStore").value = store || "";
          document.getElementById("inpAmount").value = total || "";
          document.getElementById("inpDate").value = date || new Date().toISOString().split("T")[0];
          document.getElementById("inpCategory").value = "عام";
          document.getElementById("inpWarranty").value = "";
          document.getElementById("confirmModal").classList.remove("hidden");
        } catch(e) { alert("تم المسح، يرجى إكمال البيانات."); document.getElementById("confirmModal").classList.remove("hidden"); }
        window.closeScanner();
      }, () => {});
    };

    window.closeScanner = () => {
      if (html5QrScanner) html5QrScanner.stop().then(() => document.getElementById("scannerSection").classList.add("hidden"));
    };

    // ===== رفع الفاتورة والتحليل عبر الخادم الوسيط =====
    window.handleFileUpload = async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById("aiStatus").classList.remove("hidden");

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const base64Data = reader.result.split(",")[1];
          const mimeType = file.type || "image/jpeg";

          const response = await fetch("/api/extract", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ base64Data, mimeType })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || `فشل الخادم (${response.status})`);
          }

          const parsed = await response.json();

          document.getElementById("inpStore").value = parsed.store || "";
          document.getElementById("inpAmount").value = parsed.amount || "";
          document.getElementById("inpCategory").value = parsed.category || "";
          document.getElementById("inpItems").value = parsed.items || "";

          const invDate = parsed.date || new Date().toISOString().split("T")[0];
          document.getElementById("inpDate").value = invDate;

          let wDate = "";
          if (parsed.warranty_months && parsed.warranty_months > 0) {
            let d = new Date(invDate);
            d.setMonth(d.getMonth() + parsed.warranty_months);
            wDate = d.toISOString().split("T")[0];
          }
          document.getElementById("inpWarranty").value = wDate;

          document.getElementById("confirmModal").classList.remove("hidden");
        } catch (err) {
          console.error("تفاصيل الخطأ:", err);
          alert("رسالة الخطأ: " + err.message);
          document.getElementById("confirmModal").classList.remove("hidden");
        }
        document.getElementById("aiStatus").classList.add("hidden");
        event.target.value = "";
      };
      reader.readAsDataURL(file);
    };

    window.saveInvoiceToFirestore = async () => {
      const store = document.getElementById("inpStore").value.trim(), amount = parseFloat(document.getElementById("inpAmount").value), category = document.getElementById("inpCategory").value.trim();
      if (!store || isNaN(amount) || !category) return alert("الرجاء تعبئة المتجر، التصنيف، والمبلغ.");
      
      const invoiceData = { 
        store, amount, category, 
        items: document.getElementById("inpItems").value.trim(), 
        date: document.getElementById("inpDate").value,
        createdAt: new Date().toISOString() 
      };

      const warranty = document.getElementById("inpWarranty").value;
      if(warranty) invoiceData.warrantyDate = warranty;

      await addDoc(invoicesCol, invoiceData);
      document.getElementById("confirmModal").classList.add("hidden");
    };

    window.closeModal = () => document.getElementById("confirmModal").classList.add("hidden");
    
    window.toggleTheme = () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    };

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-900 dark:text-slate-100 min-h-screen pb-10">

  <div class="max-w-6xl mx-auto p-4 md:p-8">
    
    <header class="bg-white/70 dark:bg-darkcard/70 backdrop-blur-xl p-6 rounded-3xl shadow-sm border border-white/20 dark:border-gray-700 flex flex-col md:flex-row justify-between items-center gap-6 mb-6 sticky top-4 z-40">
      <div class="flex items-center gap-4">
        <img src="https://cdn-icons-png.flaticon.com/128/9485/9485672.png" alt="Logo" class="w-12 h-12 rounded-xl shadow-sm">
        <div>
          <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-l from-gray-900 to-gray-600 dark:from-white dark:to-gray-400">فواتيري</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 font-medium">نظام الأرشفة والتحليلات</p>
        </div>
      </div>
      
      <div class="flex gap-3 w-full md:w-auto">
        <button onclick="window.toggleTheme()" class="p-3 bg-gray-100 dark:bg-gray-800 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700"><i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 dark:hidden"></i></button>
        <button onclick="window.openScanner()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2 shadow-md shadow-emerald-500/20">
          <i data-lucide="qr-code" class="w-4 h-4"></i> مسح QR
        </button>
        <label class="cursor-pointer bg-brand-600 hover:bg-brand-700 text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2 shadow-md shadow-brand-500/20">
          <i data-lucide="sparkles" class="w-4 h-4"></i> تحليل ذكي
          <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden" onchange="window.handleFileUpload(event)" />
        </label>
      </div>
    </header>

    <div class="relative mb-6">
      <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
        <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
      </div>
      <input type="text" id="searchInput" oninput="window.handleSearch(event)" placeholder="ابحث في فواتيرك عن متجر، منتج، أو تصنيف... (مثال: كابل HDMI)" class="w-full p-4 pr-12 rounded-2xl bg-white dark:bg-darkcard border border-gray-200 dark:border-gray-700 shadow-sm focus:ring-2 focus:ring-brand-500 outline-none transition dark:text-white" />
    </div>

    <div id="scannerSection" class="hidden bg-white dark:bg-darkcard p-4 rounded-3xl shadow-sm border border-emerald-100 dark:border-emerald-900 mb-6 text-center">
      <div id="reader" class="w-full max-w-sm mx-auto overflow-hidden rounded-2xl"></div>
      <button onclick="window.closeScanner()" class="mt-4 px-6 py-2 bg-red-100 text-red-600 rounded-xl text-sm font-bold">إغلاق الكاميرا</button>
    </div>

    <div id="aiStatus" class="hidden bg-brand-50 dark:bg-brand-900/20 text-brand-800 dark:text-brand-300 p-4 rounded-2xl mb-6 flex items-center gap-4"><i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> الذكاء الاصطناعي يحلل الفاتورة ومواعيد الضمان...</div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 flex items-center gap-4 hover:-translate-y-1 transition-transform">
        <div class="p-4 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 rounded-2xl"><i data-lucide="wallet" class="w-8 h-8"></i></div>
        <div><p class="text-sm text-gray-500 dark:text-gray-400 font-bold">إجمالي المصروفات</p><h2 class="text-3xl font-black mt-1"><span id="statTotal">0</span> <span class="text-sm text-gray-400 font-normal">ر.س</span></h2></div>
      </div>
      <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 flex items-center gap-4 hover:-translate-y-1 transition-transform">
        <div class="p-4 bg-blue-50 dark:bg-blue-900/30 text-blue-600 rounded-2xl"><i data-lucide="file-text" class="w-8 h-8"></i></div>
        <div><p class="text-sm text-gray-500 dark:text-gray-400 font-bold">إجمالي الفواتير</p><h2 class="text-3xl font-black mt-1" id="statCount">0</h2></div>
      </div>
      <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 flex items-center gap-4 hover:-translate-y-1 transition-transform">
        <div class="p-4 bg-purple-50 dark:bg-purple-900/30 text-purple-600 rounded-2xl"><i data-lucide="pie-chart" class="w-8 h-8"></i></div>
        <div><p class="text-sm text-gray-500 dark:text-gray-400 font-bold">أعلى تصنيف صرفاً</p><h2 class="text-2xl font-black mt-1 text-purple-600 dark:text-purple-400" id="statTopCat">-</h2></div>
      </div>
    </div>

    <div id="confirmModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 backdrop-blur-sm p-4">
      <div class="bg-white dark:bg-darkcard w-full max-w-2xl rounded-3xl shadow-2xl p-6 md:p-8 border border-gray-100 dark:border-gray-800 transform transition-all">
        <h3 class="font-black text-xl mb-6 flex items-center gap-2"><i data-lucide="check-circle-2" class="text-emerald-500"></i> مراجعة البيانات</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-sm">
          <div><label class="block text-gray-500 text-xs mb-1.5 font-semibold">المتجر</label><input type="text" id="inpStore" class="w-full p-3 border rounded-xl dark:bg-gray-900 dark:border-gray-700 outline-none" /></div>
          <div><label class="block text-gray-500 text-xs mb-1.5 font-semibold">التصنيف</label><input type="text" id="inpCategory" class="w-full p-3 border rounded-xl bg-brand-50 text-brand-700 dark:bg-brand-900/20 dark:border-gray-700 font-bold outline-none" /></div>
          <div><label class="block text-gray-500 text-xs mb-1.5 font-semibold">المبلغ</label><input type="number" id="inpAmount" class="w-full p-3 border rounded-xl font-bold dark:bg-gray-900 dark:border-gray-700 outline-none" /></div>
          <div><label class="block text-gray-500 text-xs mb-1.5 font-semibold">تاريخ الشراء</label><input type="date" id="inpDate" class="w-full p-3 border rounded-xl dark:bg-gray-900 dark:border-gray-700 outline-none" /></div>
          <div class="md:col-span-2"><label class="block text-gray-500 text-xs mb-1.5 font-semibold">التفاصيل / المنتجات</label><input type="text" id="inpItems" class="w-full p-3 border rounded-xl dark:bg-gray-900 dark:border-gray-700 outline-none" /></div>
          <div class="md:col-span-2"><label class="block text-emerald-600 dark:text-emerald-400 text-xs mb-1.5 font-bold flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> تاريخ انتهاء الضمان (اختياري)</label><input type="date" id="inpWarranty" class="w-full p-3 border border-emerald-200 dark:border-emerald-900/50 rounded-xl bg-emerald-50/50 dark:bg-emerald-900/10 dark:text-white outline-none" /></div>
        </div>
        <div class="mt-8 flex justify-end gap-3"><button onclick="window.closeModal()" class="px-6 py-2.5 font-bold rounded-xl bg-gray-100 dark:bg-gray-800">إلغاء</button><button onclick="window.saveInvoiceToFirestore()" class="px-8 py-2.5 font-bold bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl">حفظ الفاتورة</button></div>
      </div>
    </div>

    <div class="space-y-4 mb-8"><div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide" id="categoryChips"></div><div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="storeChips"></div></div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="invoicesList"></div>
  </div>
</body>
</html>
